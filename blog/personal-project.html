<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Personal Project</title>
    <link rel="icon" type="image/x-icon" href="/assets/hat-icon-4.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/personal-project.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Eagle+Lake&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="volcano-header"></header>
    <div class="container">
      <aside class="sidenav"></aside>
      <main>
        <h1>Personal Project</h1>
        <div id="mouseDisplay" class="hide"></div>
        <div id="form-example-container">
          <div id="button-form-container">
            <div id="examples-container">
              <button id="example1Button">Example 1</button>
              <button id="example2Button">Example 2</button>
              <button id="example3Button">Example 3</button>
              <button id="example4Button">Example 4</button>
            </div>
            <div id="form-container">
              <form>
                <textarea
                  name="formText"
                  rows="5"
                  cols="40"
                  placeholder="Enter or paste your code here..."
                  autocomplete="off"
                  id="formText"
                ></textarea>
              </form>
            </div>
          </div>
          <p></p>
          <div id="button-example-container">
            <div id="change-container">
              <button id="classButton">Change Class</button>
              <button id="colorButton">Change Color</button>
              <input type="color" id="colorPicker" value="#ff0000" />
            </div>
            <div class="example-container" id="exampleContainer"></div>
          </div>
        </div>
        <p></p>
        <div id="htmlContainer"></div>
      </main>
    </div>
    <script src="../scripts/personal-project.js"></script>
  </body>
</html>
